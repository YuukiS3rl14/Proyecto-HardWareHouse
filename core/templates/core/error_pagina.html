{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{{ titulo }} — HardWareHouse</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'core/img/HWH_logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="{% static 'core/css/custom.css' %}?v=usuario1" rel="stylesheet">
    <link href="{% static 'core/css/theme.css' %}?v=visual2" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: Poppins, sans-serif;
            color: #1f2937;
        }
        .hw-error {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .hw-error-card {
            width: min(32rem, 100%);
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            text-align: center;
            padding: 2.5rem 1.5rem;
        }
        .hw-error-icon { color: #16a34a; font-size: 2.5rem; margin-bottom: 0.75rem; }
        .hw-error-card h1 { font-size: 1.75rem; margin: 0 0 0.75rem; }
        .hw-error-card p { color: #4b5563; margin-bottom: 1.5rem; }
        .hw-error-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
        .hw-error-btn {
            display: inline-block;
            background: #16a34a;
            color: #fff;
            text-decoration: none;
            border-radius: 0.5rem;
            padding: 0.7rem 1.1rem;
            font-weight: 600;
        }
        .hw-error-btn.secundario { background: #fff; color: #15803d; border: 1px solid #16a34a; }
        .hw-error-pie { text-align: center; color: #fff; background: #111827; padding: 1rem; }
    </style>
</head>
<body>
    <main class="hw-error">
        <section class="hw-error-card">
            <div class="hw-error-icon" aria-hidden="true"><i class="fas {{ icono|default:'fa-search' }}"></i></div>
            <h1>{{ titulo }}</h1>
            <p>{{ detalle }}</p>
            <div class="hw-error-actions">
                <a class="hw-error-btn" href="{% url 'core:index' %}">Volver al inicio</a>
                {% if explorar %}
                <a class="hw-error-btn secundario" href="{% url 'core:tienda' %}">Explorar productos</a>
                {% endif %}
            </div>
        </section>
    </main>
    <footer class="hw-error-pie">HardWareHouse</footer>
</body>
</html>
